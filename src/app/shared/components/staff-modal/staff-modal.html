<div class="modal-overlay">

  <div
    class="custom-modal-dialog report-modal-dialog"
    (click)="$event.stopPropagation()">

    <!-- Header -->

    <div class="modal-header">

      <div>

        <h2>

          {{
            isEditMode
              ? 'Update Staff Information'
              : 'Staff Registration'
          }}

        </h2>

        <p class="header-subtitle">

          {{
            isEditMode
              ? 'Edit laboratory staff information'
              : 'Register a new laboratory staff member'
          }}

        </p>

      </div>

      <button
        class="btn-close"
        (click)="closeModal()">

        &times;

      </button>

    </div>

    <!-- Body -->

    <div class="modal-body">

      <!-- STEP 1 -->

      @if (step === 1 && !isEditMode) {

        <form [formGroup]="accountForm">

          <div class="form-row">

            <div class="form-group">

              <label>
                Full Name
              </label>

              <input
                type="text"
                formControlName="name"
                class="form-control"
                placeholder="Enter full name"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Phone Number
              </label>

              <input
                type="text"
                formControlName="phone"
                class="form-control"
                placeholder="01xxxxxxxxx"
              />

            </div>

            <div class="form-group">

              <label>
                Email Address
              </label>

              <input
                type="email"
                formControlName="email"
                class="form-control"
                placeholder="example@mail.com"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Password
              </label>

              <input
                type="password"
                formControlName="password"
                class="form-control"
                placeholder="••••••••"
              />

            </div>

          </div>

          <div class="modal-footer">

            <button
              type="button"
              class="btn-cancel"
              (click)="closeModal()">

              Cancel

            </button>

            <button
              type="button"
              class="btn-primary"
              (click)="nextStep()"
              [disabled]="accountForm.invalid || loading">

              {{
                loading
                  ? 'Saving...'
                  : 'Next: Job Info'
              }}

            </button>

          </div>

        </form>

      }

      <!-- STEP 2 -->

      @if (step === 2) {

        <form [formGroup]="jobForm">

          <div class="form-row">

            <div class="form-group">

              <label>
                National ID
              </label>

              <input
                type="text"
                formControlName="nationalId"
                class="form-control"
                placeholder="14-digit national ID"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Department
              </label>

              <select
                formControlName="department"
                class="form-control">

                <option value="">
                  Select Department
                </option>

                <option value="Lab">
                  Laboratory
                </option>

                <option value="Reception">
                  Reception
                </option>

                <option value="Sampling">
                  Sampling
                </option>

              </select>

            </div>

            <div class="form-group">

              <label>
                Shift
              </label>

              <select
                formControlName="shift"
                class="form-control">

                <option value="">
                  Select Shift
                </option>

                <option value="morning">
                  Morning Shift
                </option>

                <option value="evening">
                  Evening Shift
                </option>

              </select>

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Salary
              </label>

              <input
                type="number"
                formControlName="salary"
                class="form-control"
                placeholder="Basic salary"
              />

            </div>

            <div class="form-group">

              <label>
                Bonus
              </label>

              <input
                type="number"
                formControlName="bonus"
                class="form-control"
                placeholder="Monthly bonus"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Pay Day
              </label>

              <input
                type="number"
                formControlName="payDay"
                class="form-control"
                placeholder="1 - 31"
              />

            </div>

          </div>

          <div class="modal-footer">

            <button
              type="button"
              class="btn-cancel"
              (click)="cancelRegistration()">

              {{
                isEditMode
                  ? 'Cancel'
                  : 'Abort & Delete'
              }}

            </button>

            <button
              type="button"
              class="btn-primary"
              (click)="submitJob()"
              [disabled]="jobForm.invalid">

              {{
                isEditMode
                  ? 'Update Details'
                  : 'Complete Registration'
              }}

            </button>

          </div>

        </form>

      }

    </div>

  </div>

</div>
