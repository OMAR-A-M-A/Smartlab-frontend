<div class="modal-overlay">
  <div class="custom-modal-dialog report-modal-dialog" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Edit Report' : 'Add New Report' }}</h2>
      <button class="btn-close" (click)="closeModal()">&times;</button>
    </div>

    <!-- Body -->
    <form [formGroup]="reportForm">
      <div class="modal-body">

        <p class="text-muted small mb-4">Enter patient details and test results below.</p>

        <!-- Patient & Referred By -->
        <!-- Patient & Referred By -->
          <!-- Patient & Referred By -->
            <div class="form-row">

              <!-- Patient -->
              <div class="form-group">

                <label>
                  Patient ID
                </label>

                <input
                  type="text"
                  formControlName="patient"
                  class="form-control"
                  placeholder="Patient ID"

                />

                <span
                  class="error-text"
                  *ngIf="
                    reportForm.get('patient')?.touched &&
                    reportForm.get('patient')?.invalid
                  ">

                  Patient ID is required

                </span>

              </div>

              <!-- Referred By -->
              <div class="form-group">

                <label>
                  Referred By
                </label>

                <input
                  type="text"
                  formControlName="referredBy"
                  class="form-control"
                  placeholder="Doctor name"

                />

                <span
                  class="error-text"
                  *ngIf="
                    reportForm.get('referredBy')?.touched &&
                    reportForm.get('referredBy')?.invalid
                  ">

                  Referred by is required

                </span>

              </div>

            </div>

        <!-- Tests Section -->
        <div class="mt-4">
          <div class="tests-header">
            <label class="mb-0">Tests List</label>
            <button type="button" class="btn-add-test" (click)="addTest()">
              + Add Test
            </button>
          </div>

          <div formArrayName="tests">
            <div *ngFor="let t of tests.controls; let i = index"
              [formGroupName]="i"
              class="test-card mt-3">

              <!-- Test Card Header -->
              <div class="test-card-header">
                <span class="test-badge">Test #{{ i + 1 }}</span>
                <button type="button" class="btn-remove-test" (click)="removeTest(i)" title="Remove test">
                  &times;
                </button>
              </div>

              <!-- Row 1: Name, Category, Result -->
              <div class="form-row">
                <div class="form-group">
                  <label>Test Name</label>
                  <input formControlName="testName" class="form-control" placeholder="e.g. CBC" />
                </div>
                <div class="form-group">
                  <label>Category</label>
                  <input formControlName="category" class="form-control" placeholder="Hematology" />
                </div>
                <div class="form-group form-group--small">
                  <label>Result</label>
                  <input type="number" formControlName="result" class="form-control form-control--highlight" />
                </div>
              </div>

              <!-- Row 2: Range, Unit, Status, Critical -->
              <div class="form-row mt-3" formGroupName="referenceRange">
                <div class="form-group form-group--small">
                  <label>Min</label>
                  <input type="number" formControlName="low" class="form-control" />
                </div>
                <div class="form-group form-group--small">
                  <label>Max</label>
                  <input type="number" formControlName="high" class="form-control" />
                </div>
              </div>

              <div class="form-row mt-3">
                <div class="form-group">
                  <label>Unit</label>
                  <input formControlName="unit" class="form-control" placeholder="mg/dL" />
                </div>
                <div class="form-group">
                  <label>Status</label>
                  <select formControlName="status" class="form-control">
                    <option value="N">Normal</option>
                    <option value="H">High</option>
                    <option value="L">Low</option>
                  </select>
                </div>
                <div class="form-group form-group--small d-flex flex-column justify-content-end">
                  <label>Critical</label>
                  <div class="critical-toggle">
                    <input type="checkbox" formControlName="critical" id="critical-{{i}}" />
                    <label for="critical-{{i}}" class="critical-label">Mark as critical</label>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- Empty State -->
          <div *ngIf="tests.controls.length === 0" class="no-tests">
            <i class="fa-solid fa-flask-vial"></i>
            <p>No tests added yet. Click "+ Add Test" to begin.</p>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="closeModal()">
          Cancel
        </button>
        <button type="button" class="btn-primary" (click)="submit()" [disabled]="reportForm.invalid">
          {{ isEditMode ? 'Update' : 'Save' }} Report
        </button>
      </div>
    </form>

  </div>
</div>
