<div class="p-4" dir="ltr">
  <div class="mb-4">
    <h3 class="fw-bold m-0">{{ isEditMode ? 'Edit Report' : 'Add New Report' }}</h3>
    <p class="text-muted small">Enter patient details and test results below.</p>
  </div>

  <mat-dialog-content [formGroup]="reportForm" class="m-0 p-0">
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label fw-bold small text-muted">Patient ID</label>
        <input type="text" formControlName="patient" class="form-control custom-input" placeholder="#A-125301">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small text-muted">Referred By</label>
        <input type="text" formControlName="referredBy" class="form-control custom-input" placeholder="Dr. Ahmed Ali">
      </div>
    </div>

    <hr class="text-muted opacity-25">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold m-0">Tests List</h5>
      <button type="button" class="btn btn-outline-primary btn-sm px-3" (click)="addTest()">+ Add Test</button>
    </div>

    <div formArrayName="tests">
      <div *ngFor="let t of tests.controls; let i=index" [formGroupName]="i" class="test-card mb-3 p-3 border rounded-3 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="badge bg-light text-primary border">Test #{{i+1}}</span>
          <button type="button" class="btn-close small" (click)="removeTest(i)"></button>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <label class="small text-muted">Test Name</label>
            <input formControlName="testName" class="form-control form-control-sm border-0 bg-light" placeholder="e.g. CBC">
          </div>
          <div class="col-md-4">
            <label class="small text-muted">Category</label>
            <input formControlName="category" class="form-control form-control-sm border-0 bg-light" placeholder="Hematology">
          </div>
          <div class="col-md-3">
            <label class="small text-muted">Result</label>
            <input type="number" formControlName="result" class="form-control form-control-sm border-primary text-primary fw-bold" style="background: #f0f7ff;">
          </div>
        </div>

        <div class="row g-2" formGroupName="referenceRange">
          <div class="col-md-3">
            <label class="small text-muted">Min</label>
            <input type="number" formControlName="low" class="form-control form-control-sm border-0 bg-light">
          </div>
          <div class="col-md-3">
            <label class="small text-muted">Max</label>
            <input type="number" formControlName="high" class="form-control form-control-sm border-0 bg-light">
          </div>
          <div class="col-md-4">
            <label class="small text-muted">Status</label>
            <select formControlName="status" class="form-select form-select-sm border-0 bg-light">
              <option value="N">Normal</option>
              <option value="H">High</option>
              <option value="L">Low</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end pb-1">
             <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" formControlName="critical">
             </div>
          </div>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="mt-4 pt-3 border-top">
    <button mat-button mat-dialog-close class="text-muted">Cancel</button>
    <button class="btn btn-primary px-5 py-2 fw-bold" (click)="submit()" [disabled]="reportForm.invalid">
      {{ isEditMode ? 'Update' : 'Save' }} Report
    </button>
  </mat-dialog-actions>
</div>
