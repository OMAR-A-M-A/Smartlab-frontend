<div class="modal-overlay">

  <div
    class="custom-modal-dialog report-modal-dialog"
    (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">

      <div>

        <h2>
          {{
            isEditMode
              ? 'Update Medical Info'
              : 'Patient Registration'
          }}
        </h2>

        <p class="header-subtitle">

          {{
            isEditMode
              ? 'Edit patient medical information'
              : 'Register a new patient account'
          }}

        </p>

      </div>

      <button
        class="btn-close"
        (click)="closeModal()">

        &times;

      </button>

    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- STEP 1 -->
      @if (step === 1 && !isEditMode) {

        <form [formGroup]="accountForm">

          <div class="form-row">

            <div class="form-group">

              <label>
                Full Name
              </label>

              <input
                type="text"
                formControlName="name"
                class="form-control"
                placeholder="Enter full name"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Phone
              </label>

              <input
                type="text"
                formControlName="phone"
                class="form-control"
                placeholder="01xxxxxxxxx"
              />

            </div>

            <div class="form-group">

              <label>
                Email
              </label>

              <input
                type="email"
                formControlName="email"
                class="form-control"
                placeholder="example@mail.com"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Password
              </label>

              <input
                type="password"
                formControlName="password"
                class="form-control"
                placeholder="••••••••"
              />

            </div>

          </div>

          <div class="modal-footer">

            <button
              type="button"
              class="btn-cancel"
              (click)="closeModal()">

              Cancel

            </button>

            <button
              type="button"
              class="btn-primary"
              (click)="nextStep()"
              [disabled]="accountForm.invalid || loading">

              Next: Medical Info

            </button>

          </div>

        </form>

      }

      <!-- STEP 2 -->
      @if (step === 2) {

        <form [formGroup]="medicalForm">

          <div class="form-row">

            <div class="form-group">

              <label>
                Gender
              </label>

              <select
                formControlName="gender"
                class="form-control">

                <option value="male">
                  Male
                </option>

                <option value="female">
                  Female
                </option>

              </select>

            </div>

            <div class="form-group">

              <label>
                Age
              </label>

              <input
                type="number"
                formControlName="age"
                class="form-control"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Weight (kg)
              </label>

              <input
                type="number"
                formControlName="weight"
                class="form-control"
              />

            </div>

            <div class="form-group">

              <label>
                Height (cm)
              </label>

              <input
                type="number"
                formControlName="height"
                class="form-control"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Smoker
              </label>

              <select
                formControlName="isSmoker"
                class="form-control">

                <option [ngValue]="true">
                  Yes
                </option>

                <option [ngValue]="false">
                  No
                </option>

              </select>

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Chronic Diseases
              </label>

              <input
                type="text"
                formControlName="chronicDiseases"
                class="form-control"
                placeholder="Diabetes, Blood Pressure"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Current Medications
              </label>

              <input
                type="text"
                formControlName="medications"
                class="form-control"
                placeholder="Panadol, Insulin"
              />

            </div>

          </div>

          <div class="form-row mt-3">

            <div class="form-group">

              <label>
                Previous Surgeries
              </label>

              <input
                type="text"
                formControlName="previousSurgeries"
                class="form-control"
                placeholder="Appendix surgery"
              />

            </div>

          </div>

          <div class="modal-footer">

            <button
              type="button"
              class="btn-cancel"
              (click)="cancelRegistration()">

              {{
                isEditMode
                  ? 'Cancel'
                  : 'Abort & Delete'
              }}

            </button>

            <button
              type="button"
              class="btn-primary"
              (click)="submit()"
              [disabled]="medicalForm.invalid">

              {{
                isEditMode
                  ? 'Update'
                  : 'Complete Registration'
              }}

            </button>

          </div>

        </form>

      }

    </div>

  </div>

</div>
