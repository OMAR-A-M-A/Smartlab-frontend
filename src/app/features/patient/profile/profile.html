<div class="profile-wrapper mt-5">

  @if (isLoading) {
  <div class="text-center py-5 text-muted d-flex flex-column align-items-center justify-content-center"
    style="min-height: 400px;">
    <i class="fa-solid fa-spinner fa-spin fa-2x mb-2 text-primary"></i>
    <span class="small">Loading profile...</span>
  </div>
  } @else {

  <div class="avatar-section">
    <div class="avatar-ring mb-4">
      <img class="avatar-img" [src]="profileImage" alt="" />
    </div>
  </div>

  <div class="info-card">

    <div class="info-card-header">
      <span class="info-card-title">Personal Info</span>
      <button class="edit-btn" (click)="toggleEdit()">
        {{ isEditing ? 'Cancel' : 'Edit' }}
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
    </div>

    <div class="info-grid">

      <!-- name - read only -->
        <div class="info-field">
          <span class="field-label">Name</span>
          <span class="field-value">{{ patient?.name || '—' }}</span>
        </div>

        <!-- email - read only -->
        <div class="info-field">
          <span class="field-label">Email</span>
          <span class="field-value">{{ patient?.email || '—' }}</span>
        </div>

        <!-- phone - read only -->
        <div class="info-field">
          <span class="field-label">Phone</span>
          <span class="field-value">{{ patient?.phone || '—' }}</span>
        </div>

      <div class="info-field">
        <span class="field-label">Age</span>
        <span class="field-value" *ngIf="!isEditing">{{ patient?.age || '—' }}</span>
        <input class="edit-input" *ngIf="isEditing" [(ngModel)]="editForm.age" type="number" placeholder="Age" />
      </div>

      <div class="info-field">
        <span class="field-label">Weight (kg)</span>
        <span class="field-value" *ngIf="!isEditing">{{ patient?.weight || '—' }}</span>
        <input class="edit-input" *ngIf="isEditing" [(ngModel)]="editForm.weight" type="number" placeholder="Weight" />
      </div>

      <div class="info-field">
        <span class="field-label">Height (cm)</span>
        <span class="field-value" *ngIf="!isEditing">{{ patient?.height || '—' }}</span>
        <input class="edit-input" *ngIf="isEditing" [(ngModel)]="editForm.height" type="number" placeholder="Height" />
      </div>

    </div>

    <div class="edit-actions" *ngIf="isEditing">
      <button class="save-btn-info" (click)="saveEdit()">Save Changes</button>
    </div>

  </div>

  }

</div>
