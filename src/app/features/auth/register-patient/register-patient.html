<div class="register-section d-flex align-items-center justify-content-center bg-light py-5"
  style="min-height: calc(100vh - 80px);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
          <div class="row g-0 align-items-center">

            <div class="col-md-5 d-none d-md-block text-center bg-white p-4">
              <img src="/images/reg.png" alt="Patient Registration" class="img-fluid"
                style="max-width: 90%;">
            </div>

            <div class="col-md-7 p-4 p-md-5 ps-md-4">
              <h2 class="text-primary fw-bold mb-2">Create New Account</h2>
              <p class="text-muted mb-4 pb-2">Join EL-NOUR LAB to manage your tests and results.</p>

              <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark mb-2">Full Name</label>
                  <input type="text" class="form-control form-control-lg bg-light border-0 custom-input"
                    formControlName="name" placeholder="Ahmed Ali">
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark mb-2">Phone Number</label>
                  <input type="text" class="form-control form-control-lg bg-light border-0 custom-input"
                    formControlName="phone" placeholder="01012345678">
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold text-dark mb-2">Email Address</label>
                  <input type="email" class="form-control form-control-lg bg-light border-0 custom-input"
                    formControlName="email" placeholder="ahmed@gmail.com">
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold text-dark mb-2">Password</label>
                  <input type="password" class="form-control form-control-lg bg-light border-0 custom-input"
                    formControlName="password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold mb-4 shadow-sm"
                  [disabled]="registerForm.invalid">
                  Register Now
                </button>

                <div class="text-center">
                  <p class="text-muted mb-0">Already have an account?
                    <a routerLink="/login" class="text-primary fw-bold text-decoration-none">Login Here</a>
                  </p>
                </div>

              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
