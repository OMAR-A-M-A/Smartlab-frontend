<div class="d-flex align-items-center justify-content-center bg-light py-5" style="min-height: calc(100vh - 80px);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
          <div class="p-4 p-md-5">
            <div class="text-center mb-4">
              <h2 class="text-primary fw-bold">Forgot Password?</h2>
              <p class="text-muted">Enter your registered Email or Patient ID to reset your password.</p>
            </div>

            <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
              <div class="mb-4">
                <label class="form-label fw-semibold text-dark mb-2">Email or ID</label>
                <input type="text" class="form-control form-control-lg bg-light border-0 custom-input"
                  formControlName="identifier" placeholder="Enter your data">
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold mb-3 shadow-sm"
                [disabled]="forgotForm.invalid">
                Send Reset Link
              </button>

              <div class="text-center">
                <a routerLink="/login" class="text-muted fw-medium text-decoration-none">&larr; Back to Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
