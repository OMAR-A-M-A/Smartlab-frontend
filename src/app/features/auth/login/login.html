<div class="login-section d-flex align-items-center justify-content-center bg-light"
  style="min-height: calc(100vh - 80px);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <div class="row align-items-center">

            <div class="col-md-5 text-center mb-5 mb-md-0">
              <img src="/images/login.png" alt="Security Shield" class="img-fluid" style="max-width: 85%;">
            </div>

            <div class="col-md-7 ps-md-5">
              <h2 class="text-primary fw-bold mb-2">View Your Results</h2>
              <p class="text-muted mb-4 pb-2">to see your test results please enter your Data.</p>

              <form [formGroup]="loginForm" (ngSubmit)="login()">

                <div class="mb-4">
                  <label class="form-label fw-semibold text-dark mb-2">User Name</label>
                  <input type="text" class="form-control form-control-lg bg-light border-0 custom-input"
                    formControlName="identifier" placeholder="Enter your patientID or Email">
                </div>

                <div class="mb-2">
                  <label class="form-label fw-semibold text-dark mb-2">Password</label>
                  <input type="password" class="form-control form-control-lg bg-light border-0 custom-input"
                    formControlName="password" placeholder="Enter your password">
                </div>

                <div class="d-flex justify-content-between  m2-5 flex-column">

                  <div class="small text-dark">
                    Forget my
                    <a routerLink="/forgot-password" class="text-primary fw-bold text-decoration-none">Password</a>
                  </div>

                  <button type="submit" [disabled]="loginForm.invalid"
                    class="btn btn-primary btn-lg px-4 d-flex align-items-center gap-2 rounded-3 fw-medium align-self-end">
                    Enter <span class="fs-5 lh-1"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
                  </button>
                  <div class="small text-dark">
                    Don't Have Account
                    <a routerLink="/register" class="text-primary fw-bold text-decoration-none">Create One</a>
                  </div>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
