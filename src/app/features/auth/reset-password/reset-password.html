<div class="d-flex align-items-center justify-content-center bg-light py-5" style="min-height: calc(100vh - 80px);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white p-4 p-md-5">

          <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">Set New Password</h2>
            <p class="text-muted">Please type your new password below.</p>
          </div>

          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-semibold text-dark mb-2">New Password</label>
              <input type="password" class="form-control form-control-lg bg-light border-0 custom-input"
                formControlName="newPassword" placeholder="Enter new password">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold text-dark mb-2">Confirm Password</label>
              <input type="password" class="form-control form-control-lg bg-light border-0 custom-input"
                formControlName="confirmPassword" placeholder="Confirm new password">
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-bold mb-3 shadow-sm"
              [disabled]="resetForm.invalid">
              Reset Password
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
