<div class="dash-container">

  <!-- Header -->
  <div class="dash-header">
    <div>
      @if (isLoading) {
        <h1 class="dash-title">Welcome back</h1>
      } @else {
        <h1 class="dash-title">Welcome back {{ staffName }}</h1>
      }
      <p class="dash-subtitle">Manage lab reports, daily schedule, and test references.</p>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of statsCards">
      <div class="stat-top">
        <div class="stat-icon" [style.backgroundColor]="stat.bg" [style.color]="stat.color">
          <i [class]="stat.icon" style="font-size: 20px;"></i>
        </div>
        <span class="stat-label">{{ stat.title }}</span>
      </div>
      <div class="stat-number">
        @if (isLoading) {
          <span class="placeholder-glow"><span class="placeholder col-4"></span></span>
        } @else {
          {{ stat.value }}
        }
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div class="ui-card chart-card">
    <div class="ui-card-header">
      <h3 class="ui-card-title">Reports Overview</h3>
    </div>
    <div class="chart-flex">
      <div class="chart-wrapper">
        <apx-chart
          [series]="chartOptions.series"
          [chart]="chartOptions.chart"
          [labels]="chartOptions.labels"
          [colors]="chartOptions.colors"
          [plotOptions]="chartOptions.plotOptions"
          [dataLabels]="chartOptions.dataLabels"
          [stroke]="chartOptions.stroke"
          [legend]="chartOptions.legend"
          [tooltip]="chartOptions.tooltip">
        </apx-chart>
      </div>
      <div class="custom-legend">
        <div class="legend-row">
          <span class="dot bg-green"></span>
          <span>Sent to patient (completed)</span>
        </div>
        <div class="legend-row">
          <span class="dot bg-navy"></span>
          <span>Ready to send</span>
        </div>
        <div class="legend-row">
          <span class="dot bg-yellow"></span>
          <span>In-Progress</span>
        </div>
      </div>
    </div>
  </div>

</div>
