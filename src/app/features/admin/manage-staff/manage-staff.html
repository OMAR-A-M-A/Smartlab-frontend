<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary">Manage Staff</h2>

    <button mat-raised-button color="primary" (click)="openAddModal()">Add Staff</button>
  </div>

  <mat-form-field appearance="outline" class="w-100 mb-3">
    <input matInput placeholder="Search..." (keyup)="applyFilter($event)" />
  </mat-form-field>

  <div class="mat-elevation-z8 rounded overflow-hidden">
    <table mat-table [dataSource]="dataSource" matSort class="w-100">
      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">
          {{ row.accountId?.name }}
        </td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">
          {{ row.accountId?.email }}
        </td>
      </ng-container>

      <!-- Department -->
      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let row">
          {{ row.department }}
        </td>
      </ng-container>

      <!-- Shift -->
      <ng-container matColumnDef="shift">
        <th mat-header-cell *matHeaderCellDef>Shift</th>
        <td mat-cell *matCellDef="let row">
          {{ row.shift }}
        </td>
      </ng-container>

      <!-- Salary -->
      <ng-container matColumnDef="salary">
        <th mat-header-cell *matHeaderCellDef>Salary</th>
        <td mat-cell *matCellDef="let row">
          {{ row.salary }}
        </td>
      </ng-container>

      <!-- Actions -->
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <div class="d-flex gap-2">
            <!-- زرار التعديل الجديد -->
            <button mat-stroked-button color="primary"  size="small" (click)="openEditModal(row)">
              <mat-icon class="me-1">edit</mat-icon>
              Edit
            </button>

            <!-- زرار المسح -->
            <button mat-stroked-button color="warn" (click)="deleteStaff(row._id)">
              <mat-icon class="me-1">delete</mat-icon>
              Delete
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSize]="5"></mat-paginator>
  </div>
</div>
